name: Verify static cache compatibility
on:
  push:
    branches: [release/static-scroll-sculpture-30088e9]
    paths: [.github/workflows/retain-static-cache-compat.yml]
permissions:
  contents: read
jobs:
  preserve:
    if: github.repository == 'IzignaMx/izignamx-public-static' && github.ref == 'refs/heads/release/static-scroll-sculpture-30088e9' && github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_MAIN: dc3944bc1d80914cad604b0b0e172defae0badb1
      REVIEWED_PUBLICATION: 48f238063fc7bcd1aecad6513655b99ff47f82fe
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: release/static-scroll-sculpture-30088e9
          fetch-depth: 2
          persist-credentials: true
      - name: Check the exact publication parents
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$REVIEWED_PUBLICATION"
          test "$(git rev-parse "$REVIEWED_PUBLICATION^{tree}")" = cc14d1314a67f96548f5e703273559809ad541e4
          git fetch --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
      - name: Preserve prior assets without changing the reviewed artifact
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, subprocess
          from pathlib import Path
          root = Path.cwd()
          def entries(ref):
              result = {}
              for item in subprocess.check_output(['git', 'ls-tree', '-rz', ref]).split(b'\0'):
                  if not item:
                      continue
                  metadata, name = item.split(b'\t', 1)
                  mode, kind, sha = metadata.decode().split()
                  if kind != 'blob' or mode != '100644':
                      raise SystemExit('Unexpected file kind or mode')
                  result[name.decode()] = sha
              return result
          old = entries(os.environ['EXPECTED_MAIN'])
          reviewed = entries(os.environ['REVIEWED_PUBLICATION'])
          legacy = {name: sha for name, sha in old.items() if name.startswith('assets/') and name not in reviewed}
          if not legacy:
              raise SystemExit('Expected prior assets to retain, found none')
          print('Prior asset references missing from exact export:', len(legacy))
          for name in sorted(legacy):
              if (root / name).exists():
                  raise SystemExit('Refusing to replace an existing current asset')
              subprocess.run(['git', 'restore', '--source', os.environ['EXPECTED_MAIN'], '--worktree', '--', name], check=True)
          helper = root / '.github/workflows/retain-static-cache-compat.yml'
          helper.unlink()
          expected = {**reviewed, **legacy}
          expected.pop('SHA256SUMS')
          for name, sha in expected.items():
              data = (root / name).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if actual != sha:
                  raise SystemExit('Reviewed or retained file changed: ' + name)
          manifest = ''.join(f'{hashlib.sha256((root / name).read_bytes()).hexdigest()}  {name}\n' for name in sorted(expected))
          (root / 'SHA256SUMS').write_text(manifest, encoding='utf-8')
          subprocess.run(['git', 'add', '--all'], check=True)
          tracked = set(filter(None, subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')))
          if tracked != set(expected) | {'SHA256SUMS'}:
              raise SystemExit('Unexpected final publication inventory')
          print('All 208 reviewed static files remain byte-identical.')
          print('Retained older public assets:', len(legacy))
          print('Checksum manifest entries:', len(expected))
          print('Verified publication tree:', subprocess.check_output(['git', 'write-tree'], text=True).strip())
          PY
          git diff --cached --exit-code origin/main -- CNAME .nojekyll .github fonts
          git diff --cached --stat
      - name: Verify compatibility, checksums and delivery boundaries
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS
          python3 .github/scripts/validate-static.py .
          python3 -m unittest discover -s .github/scripts -p 'test_cdn_purge.py' -v
          python3 .github/scripts/purge_cdn.py --dry-run > "$RUNNER_TEMP/static-purge-inventory.json"
          python3 -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP']+'/static-purge-inventory.json')); assert d['dryRun'] is True and d['count']==150; print('150-URL dry run passed; no live purge requested.')"
      - name: Commit cache-compatible publication to the review branch
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(static): retain previous bundles for cached pages' -m 'Keep every file from the reviewed static artifact byte-identical. Retain previous public assets so browser- or CDN-cached HTML can still load its original hashed dependencies. Refresh the complete checksum inventory and remove this one-use helper. Delivery controls, fonts and DNS configuration are unchanged.'
          git push origin HEAD:refs/heads/release/static-scroll-sculpture-30088e9
          printf 'Verified publication commit: '
          git rev-parse HEAD
