name: Validate static publication
on:
  push:
    branches: [main, version_1.5.0]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate root artifact, routes, assets and CSP
        run: python3 .github/scripts/validate-static.py .
      - name: Test the CDN delivery boundary without credentials or network
        run: python3 -m unittest discover -s .github/scripts -p 'test_cdn_purge.py' -v
      - name: Review the bounded purge inventory without invalidating anything
        run: python3 .github/scripts/purge_cdn.py --dry-run
