name: Import reviewed static version 1.5.0
on:
  push:
    branches: [version_1.5.0]
    paths: ['.github/workflows/import-version-1.5.0.yml']
permissions:
  contents: write
concurrency:
  group: import-static-version-1.5.0
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'IzignaMx/izignamx-public-static' && github.ref == 'refs/heads/version_1.5.0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: version_1.5.0
          fetch-depth: 1
      - name: Download and verify exact reviewed artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/static.zip" 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Icvp3WfrHKY6QGnlXqcYgbAGfb/643e3177-f899-4a8d-8b42-49ca64e6c573.zip'
          echo "41bb610e339bc590f7aed28c6c8e82d6971a086626b8fab0363e032c6a6ee2e8  $RUNNER_TEMP/static.zip" | sha256sum --check --status
          python3 - <<'PY'
          import os, zipfile, pathlib, stat
          source=pathlib.Path(os.environ['RUNNER_TEMP'])/'static.zip'
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'static-payload'
          target.mkdir()
          with zipfile.ZipFile(source) as archive:
              for info in archive.infolist():
                  path=pathlib.PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
                  assert not stat.S_ISLNK(info.external_attr >> 16)
              archive.extractall(target)
          PY
          cd "$RUNNER_TEMP/static-payload"
          sha256sum --check --status SHA256SUMS
          python3 .github/scripts/validate-static.py .
      - name: Import only into the requested release branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'version_1.5.0'
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' "$RUNNER_TEMP/static-payload/" ./
          python3 .github/scripts/validate-static.py .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish reviewed static website 1.5.0 at repository root'
          git push origin HEAD:refs/heads/version_1.5.0
