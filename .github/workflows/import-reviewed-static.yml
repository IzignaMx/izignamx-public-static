name: Import reviewed static publication

on:
  push:
    branches: [release/static-scroll-sculpture-30088e9]
    paths: [.github/workflows/import-reviewed-static.yml]

permissions:
  contents: read

concurrency:
  group: import-reviewed-static-30088e9
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'IzignaMx/izignamx-public-static' && github.ref == 'refs/heads/release/static-scroll-sculpture-30088e9' && github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_MAIN: dc3944bc1d80914cad604b0b0e172defae0badb1
      EXPECTED_ARTIFACT_TREE: f9a5a9e3653f2fa2cf2fe756a7f5aa770f23ffc5
      EXPECTED_TREE: cc14d1314a67f96548f5e703273559809ad541e4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: release/static-scroll-sculpture-30088e9
          persist-credentials: true
      - name: Check publication lease
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
      - name: Retrieve the reviewed public-only artifact
        env:
          STATIC_ARCHIVE_URL: 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-284c-81f6-83eb-4962c3dd30ec/raw?se=2026-11-03T05%3A12%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=5f209df3-b5a3-5449-a7f6-68d7c0ad05a4&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-02T22%3A33%3A25Z&ske=2026-11-03T22%3A33%3A25Z&sks=b&skv=2026-02-06&sig=C7%2B17hDvyivxfBspi0IfNlPnQFiqp/oD5ufOuIcUHbI%3D'
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location --max-time 90 --proto '=https' --tlsv1.2 "$STATIC_ARCHIVE_URL" --output "$RUNNER_TEMP/reviewed-static.zip"
          printf '%s  %s\n' fb021a96a70de97280026bd10ffad661615362b019714754adb3829095dcf0de "$RUNNER_TEMP/reviewed-static.zip" | sha256sum --check --strict
      - name: Import exact static bytes and regenerate the checksum manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess, tarfile, zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          temporary = Path(os.environ['RUNNER_TEMP']) / 'reviewed-static-import'
          temporary.mkdir()
          archive = Path(os.environ['RUNNER_TEMP']) / 'reviewed-static.zip'
          with zipfile.ZipFile(archive) as package:
              if package.namelist() != ['static-review.tar.gz']:
                  raise SystemExit('Unexpected ZIP inventory')
              package.extractall(temporary)
          candidate = temporary / 'site'
          candidate.mkdir()
          with tarfile.open(temporary / 'static-review.tar.gz') as package:
              for member in package.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or '.git' in path.parts:
                      raise SystemExit('Unsafe archive path')
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit('Non-regular archive member')
              package.extractall(candidate, filter='data')
          files = {p.relative_to(candidate).as_posix(): p for p in candidate.rglob('*') if p.is_file()}
          if len(files) != 208:
              raise SystemExit('Unexpected static file count')
          release = json.loads((candidate / 'release.json').read_text())
          if release['sourceRevision'] != 'b1581464ea4de8f1769aeb351dd06ae5c844f5db':
              raise SystemExit('Unexpected reviewed source revision')
          if (release['pages'], release['aliases']) != (48, 24):
              raise SystemExit('Unexpected route inventory')
          for name, source in files.items():
              if name in ('CNAME', '.nojekyll') or name.startswith('.github/'):
                  destination = root / name
                  if not destination.is_file() or destination.read_bytes() != source.read_bytes():
                      raise SystemExit('Protected delivery file differs: ' + name)
          helper = '.github/workflows/import-reviewed-static.yml'
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for name in filter(None, tracked):
              if name not in files:
                  if not (name in (helper, 'SHA256SUMS') or name.startswith('assets/') or name.endswith('.html')):
                      raise SystemExit('Refusing to remove unexpected tracked file: ' + name)
                  (root / name).unlink()
          for name, source in files.items():
              destination = root / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
          subprocess.run(['git', 'add', '--all'], check=True)
          actual = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          if actual != os.environ['EXPECTED_ARTIFACT_TREE']:
              raise SystemExit('Static tree does not match the independently verified artifact: ' + actual)
          print('Exact artifact tree verified:', actual)
          manifest = ''.join(f'{hashlib.sha256(files[name].read_bytes()).hexdigest()}  {name}\n' for name in sorted(files))
          (root / 'SHA256SUMS').write_text(manifest, encoding='utf-8')
          subprocess.run(['git', 'add', 'SHA256SUMS'], check=True)
          actual = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          if actual != os.environ['EXPECTED_TREE']:
              raise SystemExit('Publication tree does not match the independently verified manifest: ' + actual)
          print('Publication tree with refreshed 208-file manifest verified:', actual)
          print('Protected CNAME, .nojekyll and delivery files preserved. Temporary helper removed.')
          PY
          git diff --cached --stat
          git diff --cached --exit-code origin/main -- CNAME .nojekyll .github
      - name: Validate the final static tree
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS
          python3 .github/scripts/validate-static.py .
          python3 -m unittest discover -s .github/scripts -p 'test_cdn_purge.py' -v
          python3 .github/scripts/purge_cdn.py --dry-run > "$RUNNER_TEMP/static-purge-inventory.json"
          python3 -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP']+'/static-purge-inventory.json')); assert d['dryRun'] is True and d['count']==150; print('Verified 150-URL dry run; no live purge requested.')"
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - name: Commit verified distribution to the publication branch only
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(static): publish merged scroll sculpture' -m 'Publish the exact static-review artifact 13206500753 from reviewed source b1581464ea4de8f1769aeb351dd06ae5c844f5db. Its application tree is identical to merged source 30088e90a71f91eb5a8c27132decfebaa051bf00.' -m 'Artifact ZIP SHA-256: fb021a96a70de97280026bd10ffad661615362b019714754adb3829095dcf0de. Artifact tree: f9a5a9e3653f2fa2cf2fe756a7f5aa770f23ffc5. Publication tree including refreshed SHA256SUMS: cc14d1314a67f96548f5e703273559809ad541e4. Preserve delivery controls and remove the one-use import workflow.'
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin HEAD:refs/heads/release/static-scroll-sculpture-30088e9
          printf 'Published review branch commit: '
          git rev-parse HEAD
